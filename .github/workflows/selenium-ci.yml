name: Employee Management Automation Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:
    name: Regression Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Cache Maven Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: maven-${{ hashFiles('**/pom.xml') }}

      # 🔥 Ensure environment is set properly
      - name: Set Environment Variables
        run: echo "env=qa" >> $GITHUB_ENV

      # 🔥 Run Tests (stable + CI safe)
      - name: Execute Test Suite
        run: |
          mvn clean test \
          -Denv=qa \
          -Dheadless=true \
          -Djson_test_data_path=src/test/resources/testdata/login.json

      # 🔥 Generate Allure Report (only if tests ran)
      - name: Generate Allure Report
        if: always()
        run: mvn allure:report

      # 🔥 Upload Surefire Reports
      - name: Upload Surefire Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/

      # 🔥 Upload Allure Results
      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: target/allure-results/

      # 🔥 Upload Allure HTML Report
      - name: Upload Allure HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: target/site/allure-maven-plugin/